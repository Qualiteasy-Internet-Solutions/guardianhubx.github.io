name: Generate PDF from Markdown

on:
  push:
    paths:
      - 'condiciones-radar.md'
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Create docs directory
        run: mkdir -p static/docs

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc python3-pip libimage-exiftool-perl qpdf
          pip install weasyprint

      - name: Generate PDF from Markdown
        run: |
          pandoc condiciones-radar.md -f markdown -t html \
            --metadata title="" \
            --metadata author="" \
            --metadata date="" \
            -H <(echo '<meta charset="utf-8">') \
            -o /tmp/condiciones.html
          weasyprint /tmp/condiciones.html static/docs/condiciones-guardianradar.pdf
          # exiftool marca las propiedades como eliminadas mediante una actualización
          # incremental, pero los bytes originales permanecen en el fichero y son
          # recuperables. qpdf reescribe el PDF completo y los descarta de verdad,
          # conservando los marcadores de navegación. Requisito del control mp.info.5.
          exiftool -overwrite_original -all= static/docs/condiciones-guardianradar.pdf
          qpdf --linearize --replace-input static/docs/condiciones-guardianradar.pdf

      - name: Verificar que el PDF no conserva metadatos
        run: |
          if strings static/docs/condiciones-guardianradar.pdf | grep -qiE "WeasyPrint|pandoc|/Author|/Creator"; then
            echo "ERROR: el PDF generado todavía contiene metadatos"
            exit 1
          fi
          echo "PDF sin metadatos: correcto"

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/docs/condiciones-guardianradar.pdf
          git commit -m "auto: regenerate PDF from condiciones-radar.md" || true
          git push

      - name: Trigger deploy workflow
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'