# .github/workflows/deploy.yml
name: Build & Deploy GuardianHubX

on:
  # Rebuild automático al hacer push a main
  push:
    branches: [ main ]
  # Daily scheduled deploy to publish articles with future dates
  schedule:
    # 06:05 Europe/Madrid (summer = UTC+2) -> 04:05 UTC
    - cron: "5 4 * * *"
  # Manual trigger
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout main site (includes integrated blog)
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2) Setup Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.7'
          extended: true

      # 2.5) Generate /stats/config.js so the dashboard auto-connects.
      #      Token is intentionally embedded (read-only); /stats/ is meant to be
      #      shareable with partners without exchanging secrets.
      - name: Generate stats dashboard auto-config
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          if [ -z "$GOATCOUNTER_TOKEN" ]; then
            echo "::warning::GOATCOUNTER_TOKEN not set, dashboard will require manual connect"
            exit 0
          fi
          cat > static/stats/config.js <<EOF
          window.GC_AUTOCONFIG = {
            baseURL: "https://inogues.goatcounter.com",
            apiKey: "$GOATCOUNTER_TOKEN",
            me: {}
          };
          EOF
          echo "Generated static/stats/config.js ($(wc -c < static/stats/config.js) bytes)"

      # 3) Validate content URLs before building
      - name: Validate content URLs
        run: |
          python3 << 'PYTHON_EOF'
          import re
          import sys
          from pathlib import Path

          errors = []

          # Check CA blog articles have url: /blog/ca/ (not /blog/ without /ca/)
          for f in Path("content/ca/blog").glob("*.md"):
              text = f.read_text()
              m = re.search(r'^url:\s*"(/blog/[^c][^/])', text, re.MULTILINE)
              if m:
                  errors.append(f"❌ {f.name}: url: missing /ca/ prefix → {m.group(1)}")

          # Check CA pages don't use ES slugs (common copy-paste errors)
          bad_ca_slugs = [
              "formacion-phishing-software", "politica-de-privacitat",
              "guardianaradar", "test-ciberseguridad", "objectivos-ciberseguridad",
              "diccionario-ciberseguridad", "copias-de-seguridad"
          ]
          for f in Path("content/ca").glob("*.md"):
              text = f.read_text()
              for slug in bad_ca_slugs:
                  if f'/{slug}/' in text:
                      errors.append(f"⚠ {f.name}: possible wrong ES slug → /{slug}/")

          # Check EN pages don't use ES slugs
          bad_en_slugs = [
              "test-ciberseguridad", "formacion-phishing-software",
              "objetivos-ciberseguridad", "tipos-ataques-ciberneticos"
          ]
          for f in Path("content/en").glob("*.md"):
              text = f.read_text()
              for slug in bad_en_slugs:
                  if f'/{slug}/' in text:
                      errors.append(f"⚠ {f.name}: possible wrong ES slug → /{slug}/")

          if errors:
              print("URL validation found issues:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          else:
              print("✓ URL validation passed")
          PYTHON_EOF

      # 4) Build Hugo site (includes main site + integrated blog)
      - name: Build Hugo site
        run: |
          hugo --gc --minify --destination public

      # 5) Post-process minification with Node.js (CSS & JS)
      - name: Post-process Minification (CSS & JS)
        run: |
          npm install -g terser clean-css-cli
          echo "Minifying CSS..."
          find public -type f -name "*.css" ! -name "arcade.css" -exec cleancss -o {} {} \;
          echo "Minifying JS..."
          find public -type f -name "*.js" -exec terser {} -c -m -o {} \;

      # 6) Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PUBLISH }}
          publish_branch: gh-pages
          publish_dir: public
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      # 7) Notify Bing IndexNow about updated URLs (reads from generated sitemaps)
      - name: Notify Bing IndexNow
        run: |
          python3 << 'PYTHON_EOF'
          import re
          import subprocess
          import urllib.request
          import json
          from pathlib import Path

          INDEXNOW_KEY = "69caace2e14746e7b6040ff8c5b15c48"
          INDEXNOW_HOST = "guardianhubx.com"
          INDEXNOW_KEY_LOCATION = "https://guardianhubx.com/IndexNow.xml"
          INDEXNOW_API = "https://api.indexnow.org/indexnow"

          # 1) Get changed content files from git
          try:
              result = subprocess.run(
                  ["git", "diff", "--name-only", "HEAD~1..HEAD"],
                  capture_output=True, text=True
              )
              changed_files = [f for f in result.stdout.strip().split('\n') if f]
          except Exception:
              changed_files = []

          changed_content = [f for f in changed_files if f.startswith('content/')]

          # 2) If content changed, extract real URLs from the generated sitemaps
          urls = set()
          if changed_content:
              # Build set of slugs/filenames that changed
              changed_stems = set()
              for f in changed_content:
                  stem = Path(f).stem  # e.g. "ataques-fuerza-bruta" from "content/es/blog/20260527-ataques-fuerza-bruta.md"
                  changed_stems.add(stem)
                  # Also match the numeric-prefix part stripped
                  bare = re.sub(r'^\d{8}-', '', stem)
                  changed_stems.add(bare)

              # Read each language sitemap and keep URLs that match changed slugs
              for lang in ('es', 'ca', 'en'):
                  sitemap_path = Path(f'public/{lang}/sitemap.xml')
                  if not sitemap_path.exists():
                      # Fallback: root sitemap
                      sitemap_path = Path('public/sitemap.xml')
                  if not sitemap_path.exists():
                      continue
                  text = sitemap_path.read_text()
                  for loc in re.findall(r'<loc>(https?://[^<]+)</loc>', text):
                      path_part = loc.rstrip('/').split('/')[-1]
                      if path_part in changed_stems or not changed_stems:
                          urls.add(loc)

          # 3) Fallback: read all sitemap URLs (scheduled builds or no content changes)
          if not urls:
              print("No content changes detected — reading full sitemap for scheduled/full notify")
              for sitemap_file in Path('public').rglob('sitemap.xml'):
                  text = sitemap_file.read_text()
                  for loc in re.findall(r'<loc>(https?://[^<]+)</loc>', text):
                      urls.add(loc)

          url_list = list(urls)[:10000]
          print(f"Notifying IndexNow about {len(url_list)} URLs...")
          if url_list:
              print(f"Sample: {url_list[:3]}")

          payload = json.dumps({
              "host": INDEXNOW_HOST,
              "key": INDEXNOW_KEY,
              "keyLocation": INDEXNOW_KEY_LOCATION,
              "urlList": url_list
          }).encode()

          try:
              req = urllib.request.Request(
                  INDEXNOW_API,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"✓ IndexNow OK: {resp.status} ({len(url_list)} URLs)")
          except Exception as e:
              print(f"⚠ IndexNow error: {e}")

          PYTHON_EOF
        continue-on-error: true
